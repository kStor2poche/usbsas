services:
  apk_build_base:
    build:
      context: .
      dockerfile: Containerfile.apk_build_base
    platform: linux/aarch64
    # stdin_open: true
    # tty: true
    command: sh -c "rm -rf /root/packages/*; echo removed previous packages 👍; cd /usbsas-apk && abuild -F checksum && abuild -KFc"
    network: host
    volumes:
      - ./apk:/usbsas-apk
      - keys:/etc/apk/keys
      - repo:/root/packages
  img_build_base:
    build:
      context: .
      dockerfile: Containerfile.img_build_base
    platform: linux/aarch64
    # stdin_open: true
    # tty: true
    # entrypoint: /bin/ash
    network: host
    volumes:
      - keys:/etc/apk/keys
      - repo:/tmp/packages/alpine
      - ./image-out:/out:U
    depends_on:
      apk_build_base:
        condition: service_completed_successfully
        restart: true

volumes:
  keys:
  repo:
