services:
  apk_build_base:
    build:
      context: .
      dockerfile: Containerfile.apk_build_base
    platform: linux/aarch64
    # stdin_open: true
    # tty: true
    network: host
    volumes:
      - ./apk:/usbsas-apk
      - apkkeys:/etc/apk/keys
      - abuildkeys:/root/.abuild
      - repo:/root/packages

  kernel_build_base:
    build:
      context: .
      dockerfile: Containerfile.kernel_build_base
    platform: linux/aarch64
    volumes:
      - apkkeys:/etc/apk/keys
      - abuildkeys:/root/.abuild
      - repo:/root/packages

  img_build_base:
    build:
      context: .
      dockerfile: Containerfile.img_build_base
    platform: linux/aarch64
    # stdin_open: true
    # tty: true
    # entrypoint: /bin/ash
    command: --tag v3.24 --outdir /out --arch aarch64 --repository /repo/packages/alpine/ --hostkeys --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/main --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community --profile rpi_usbsas
    network: host
    volumes:
      - apkkeys:/etc/apk/keys
      - repo:/repo/packages/alpine
      - ./image-out:/out:U
    depends_on:
      apk_build_base:
        condition: service_completed_successfully
        # restart: true
      kernel_build_base:
        condition: service_completed_successfully
        # restart: true

volumes:
  apkkeys:
  abuildkeys:
  repo:
