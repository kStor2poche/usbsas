[package]
name = "usbsas-fsrw"
description = "usbsas-fsrw"
version = "0.1.5"
edition = "2024"
license = "GPL-3.0"

[dependencies]
anyhow = "1.0"
bytemuck = "1.25"
ext4-view = "1.0"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
fscommon = { git = "https://github.com/rafalh/rust-fscommon", rev = "89706258032efff88689f6083510ed34b845fe46" }
ff = { path = "./ff", default-features = false }
hadris-iso = { version = "2.5", default-features = false, features = ["std", "sync", "joliet"] }
libc = "0.2"
log = "0.4"
ntfs = "0.4"
ntfs3g = { path = "./ntfs3g", default-features = false }
positioned-io2 = "0.3"
thiserror = "2.0"
time = "0.3"
usbsas-proto = { path = "../usbsas-proto" }

[features]
default = ["bindgen-runtime"]
bindgen-runtime = [ "ff/bindgen-runtime", "ntfs3g/bindgen-runtime" ]
bindgen-static = [ "ff/bindgen-static", "ntfs3g/bindgen-static" ]
